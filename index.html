<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rematch | Tournaments</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171b22;
      --accent: #7ae0b8;
      --text: #e7edf6;
      --muted: #9fb2cc;
      --danger: #ff8f8f;
      --border: #1f2530;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(122, 224, 184, 0.08), transparent 40%),
        radial-gradient(circle at 80% 0%, rgba(122, 224, 184, 0.08), transparent 35%),
        var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 28px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 28px;
      letter-spacing: 0.2px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.5;
      max-width: 720px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0c0f14;
      color: var(--text);
      padding: 12px 12px;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      cursor: pointer;
      background: linear-gradient(135deg, rgba(122, 224, 184, 0.2), rgba(122, 224, 184, 0));
      border: 1px solid var(--accent);
      color: var(--text);
      font-weight: 700;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 14px;
      align-items: center;
    }

    .card.readonly {
      grid-template-columns: 1fr;
    }

    .card h3 {
      margin: 0;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
      word-break: break-word;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(122, 224, 184, 0.1);
      border: 1px solid rgba(122, 224, 184, 0.4);
      color: var(--accent);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .meta a {
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }

    .meta a:hover {
      text-decoration: underline;
    }

    .notes {
      grid-column: 1 / -1;
      color: var(--text);
      opacity: 0.9;
      line-height: 1.45;
      word-break: break-word;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 20px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .delete {
      background: rgba(255, 143, 143, 0.1);
      border: 1px solid rgba(255, 143, 143, 0.5);
      color: var(--danger);
    }

    .admin-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .admin-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .user-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(122, 224, 184, 0.3), rgba(255, 255, 255, 0.08));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .user-name {
      color: var(--text);
      font-weight: 600;
    }

    .user-email {
      color: var(--muted);
      font-size: 12px;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
    }

    .like-btn {
      background: rgba(122, 224, 184, 0.08);
      border: 1px solid rgba(122, 224, 184, 0.4);
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      padding: 8px 12px;
    }

    .card.liked {
      border-color: rgba(122, 224, 184, 0.7);
      box-shadow: 0 0 0 1px rgba(122, 224, 184, 0.35);
    }

    .lang-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .lang-picker label {
      display: inline-flex;
      align-items: center;
      flex-direction: row;
      margin: 0;
      padding: 0;
      color: inherit;
      gap: 4px;
    }

    .lang-picker select {
      appearance: none;
      padding: 10px 40px 10px 12px;
      background: #0c0f14;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%;
      background-size: 8px 8px, 8px 8px;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .lang-picker select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(122, 224, 184, 0.35), 0 10px 28px rgba(0, 0, 0, 0.25);
    }

    .lang-picker option {
      background: #0c0f14;
      color: var(--text);
    }

    .grid.single {
      grid-template-columns: 1fr;
    }

    @media (max-width: 640px) {
      .card {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>
  <body>
    <div class="page">
      <div class="admin-bar">
        <div class="lang-picker">
          <label for="language" id="lang-label">Language</label>
          <select id="language">
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
          </select>
        </div>
        <div class="admin-chip">
          <div class="user-badge" id="user-badge">
            <div class="user-avatar" id="user-avatar">?</div>
            <div class="user-meta">
              <span class="user-name" id="user-name">Guest</span>
              <span class="user-email" id="user-email">Not signed in</span>
            </div>
          </div>
          <button type="button" class="secondary" id="owner-toggle">Sign in with Discord</button>
        </div>
      </div>
      <header>
        <div class="title"><span id="title-text">Rematch tournaments</span></div>
        <p class="subtitle" id="subtitle">A clean list of Rematch tournaments: collect events from any platform with links and dates.</p>
      </header>

      <div class="grid" id="grid">
        <section class="panel" id="admin-panel">
          <form id="tournament-form">
            <label>
              <span id="name-label">Tournament name</span>
              <input type="text" id="name" name="name" placeholder="For example, Winter Cup" required />
            </label>
            <label>
              <span id="platform-label">Platform / organizer</span>
              <input type="text" id="platform" name="platform" placeholder="ESL, Faceit, club..." />
            </label>
            <label>
              <span id="date-label">Date</span>
              <input type="date" id="date" name="date" />
            </label>
            <label>
              <span id="link-label">Tournament link</span>
              <input type="url" id="link" name="link" placeholder="https://..." />
            </label>
            <label>
              <span id="notes-label">Notes</span>
              <textarea id="notes" name="notes" placeholder="Format, prize pool, time zone..."></textarea>
            </label>
            <button type="submit" id="submit-btn">Add tournament</button>
          </form>
        </section>

        <section class="panel list-panel" id="list-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h2 style="margin: 0; font-size: 18px;" id="list-title">Tournament list</h2>
          <div class="badge" id="counter">0</div>
        </div>
        <div id="list" class="list" aria-live="polite"></div>
      </section>
    </div>
  </div>

    const SESSION_KEY = 'rematch:discord-session';
    const PROFILE_KEY = 'rematch:discord-profile';

    let currentUser = null;
    let isOwner = false;
    let currentLang = localStorage.getItem('rematch:lang') || DEFAULT_LANG;
    let tournaments = [];
    let likes = new Set();

    function t(key) {
      const pack = translations[currentLang] || translations[DEFAULT_LANG];
      return pack[key] ?? translations[DEFAULT_LANG][key] ?? '';
    }

    function readCachedTournaments() {
      const saved = localStorage.getItem('rematch:tournaments');
      if (!saved) return [];
      try {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        console.error('Не удалось прочитать сохранённые турниры', err);
        return [];
      }
    }

    async function loadTournaments() {
      try {
        const res = await fetch(`${API_BASE}/api/tournaments`);
        if (!res.ok) throw new Error('Bad status');
        const data = await res.json();
        if (Array.isArray(data)) {
          localStorage.setItem('rematch:tournaments', JSON.stringify(data));
          return data;
        }
        return readCachedTournaments();
      } catch (err) {
        console.error('Ошибка загрузки турниров с сервера, используем локальные', err);
        return readCachedTournaments();
      }
    }

    async function saveTournaments(items) {
      localStorage.setItem('rematch:tournaments', JSON.stringify(items));
      try {
        await fetch(`${API_BASE}/api/tournaments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(items),
        });
      } catch (err) {
        console.error('Не удалось сохранить турниры на сервер', err);
      }
    }

    function getLikeStorageKey() {
      return currentUser?.id ? `rematch:likes:${currentUser.id}` : 'rematch:likes:anon';
    }

    function readCachedLikes() {
      try {
        const raw = localStorage.getItem(getLikeStorageKey());
        if (!raw) return new Set();
        const parsed = JSON.parse(raw);
        return new Set(Array.isArray(parsed) ? parsed : []);
      } catch (err) {
        console.error('Не удалось загрузить отметки', err);
        return new Set();
      }
    }

    async function loadLikes() {
      if (!currentUser?.id) {
        return readCachedLikes();
      }

      try {
        const res = await fetch(
          `${API_BASE}/api/likes?userId=${encodeURIComponent(currentUser.id)}`
        );
        if (!res.ok) throw new Error('Bad status');
        const data = await res.json();
        const arr = Array.isArray(data) ? data : [];
        localStorage.setItem(getLikeStorageKey(), JSON.stringify(arr));
        return new Set(arr);
      } catch (err) {
        console.error('Не удалось загрузить лайки с сервера, используем локальные', err);
        return readCachedLikes();
      }
    }

    async function saveLikes(set, changedId) {
      const arr = Array.from(set);
      localStorage.setItem(getLikeStorageKey(), JSON.stringify(arr));

      if (!currentUser?.id || !changedId) return;

      const liked = set.has(changedId);

      try {
        await fetch(`${API_BASE}/api/likes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: currentUser.id,
            tournamentId: changedId,
            liked,
          }),
        });
      } catch (err) {
        console.error('Не удалось сохранить лайк на сервер', err);
      }
    }

    function formatDate(value) {
      if (!value) return t('dateMissing');
      const date = new Date(value + 'T00:00:00');
      const formatter = new Intl.DateTimeFormat(translations[currentLang]?.dateLocale || translations[DEFAULT_LANG].dateLocale, {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
      });
      return formatter.format(date);
    }

    function updateUserBadge() {
      const name = currentUser?.username || t('guestName');
      const email = currentUser?.email || t('guestEmail');
      userName.textContent = name;
      userEmail.textContent = email;
      const initial = name?.charAt(0)?.toUpperCase() || '?';
      userAvatar.textContent = initial;
    }

    function updateOwnerUI() {
      ownerToggle.textContent = currentUser ? t('signoutDiscord') : t('signinDiscord');
      form.style.display = isOwner ? 'flex' : 'none';
      adminPanel.style.display = isOwner ? 'block' : 'none';
      grid.classList.toggle('single', !isOwner);
      updateUserBadge();
    }

    function applyTranslations() {
      const lang = translations[currentLang] || translations[DEFAULT_LANG];
      document.documentElement.lang = currentLang;
      document.title = lang.pageTitle;

      titleText.textContent = lang.heading;
      subtitle.textContent = lang.subtitle;
      listTitle.textContent = lang.listTitle;
      langLabel.textContent = lang.languageLabel;

      nameLabel.textContent = lang.nameLabel;
      platformLabel.textContent = lang.platformLabel;
      dateLabel.textContent = lang.dateLabel;
      linkLabel.textContent = lang.linkLabel;
      notesLabel.textContent = lang.notesLabel;

      nameInput.placeholder = lang.namePlaceholder;
      platformInput.placeholder = lang.platformPlaceholder;
      linkInput.placeholder = lang.linkPlaceholder;
      notesInput.placeholder = lang.notesPlaceholder;
      submitBtn.textContent = lang.addButton;

      updateOwnerUI();
      render(tournaments);
    }
    function normalizeDate(value) {
      if (!value) return null;
      const time = Date.parse(value); // для формата YYYY-MM-DD всё ок
      return Number.isNaN(time) ? null : time;
    }
  
    function sortTournamentsByDate(items) {
      return [...items].sort((a, b) => {
        const da = normalizeDate(a.date);
        const db = normalizeDate(b.date);
  
        // без даты — в самый низ
        if (da === null && db === null) return 0;
        if (da === null) return 1;
        if (db === null) return -1;

        // чем раньше дата, тем выше в списке
        return da - db;
      });
    }
    
    function render(items) {
      const sorted = sortTournamentsByDate(items);
    
      counterEl.textContent = sorted.length;
      listEl.innerHTML = '';
    
      if (!sorted.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = t('emptyState');
        listEl.appendChild(empty);
        return;
    }

      sorted.forEach((item) => {
        const card = document.createElement('article');
        card.className = 'card';

        const title = document.createElement('h3');
        title.textContent = item.name;
        if (item.platform) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = item.platform;
          title.appendChild(badge);
        }

        const meta = document.createElement('div');
        meta.className = 'meta';
        const date = document.createElement('div');
        date.textContent = formatDate(item.date);
        meta.appendChild(date);

        if (item.link) {
          const link = document.createElement('a');
          link.href = item.link;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = t('linkText');
          meta.appendChild(link);
        }

        card.appendChild(title);
        card.appendChild(meta);

        if (item.notes) {
          const notes = document.createElement('div');
          notes.className = 'notes';
          notes.textContent = item.notes;
          card.appendChild(notes);
        }

        if (isOwner) {
          const actions = document.createElement('div');
          actions.className = 'actions';
          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'delete';
          removeBtn.textContent = t('delete');
          removeBtn.addEventListener('click', () => {
            const filtered = tournaments.filter((entry) => entry.id !== item.id);
            tournaments = filtered;
            saveTournaments(filtered);
            render(filtered);
          });
          actions.appendChild(removeBtn);
          card.appendChild(actions);
        } else {
          card.classList.add('readonly');
          const liked = likes.has(item.id);
          if (liked) card.classList.add('liked');
          const actions = document.createElement('div');
          actions.className = 'actions';
          const likeBtn = document.createElement('button');
          likeBtn.type = 'button';
          likeBtn.className = 'like-btn';
          likeBtn.textContent = liked ? t('liked') : t('like');
          likeBtn.addEventListener('click', async () => {
            await toggleLike(item.id);
          });
          actions.appendChild(likeBtn);
          card.appendChild(actions);
        }

        listEl.appendChild(card);
      });
    }

    async function toggleLike(id) {
      if (likes.has(id)) {
        likes.delete(id);
      } else {
        likes.add(id);
      }
      render(tournaments);
      await saveLikes(likes, id);
    }

    function normalizeProfile(raw) {
      return {
        id: raw?.id,
        username: raw?.global_name || raw?.username || t('guestName'),
        email: raw?.email || '',
      };
    }

    function persistSession(session, profile) {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      if (profile) {
        localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      }
    }

    function readStoredSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (err) {
        console.error('Не удалось прочитать сессию', err);
        return null;
      }
    }

    function readStoredProfile() {
      try {
        const raw = localStorage.getItem(PROFILE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (err) {
        console.error('Не удалось прочитать профиль', err);
        return null;
      }
    }

    async function clearAuth() {
      sessionStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(PROFILE_KEY);
      currentUser = null;
      isOwner = false;
      likes = await loadLikes();
      updateOwnerUI();
      render(tournaments);
    }

    function parseTokenFromHash() {
      if (!window.location.hash) return null;
      const hash = window.location.hash.replace('#', '');
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      if (!accessToken) return null;
      return {
        accessToken,
        tokenType: params.get('token_type') || 'Bearer',
        expiresIn: Number(params.get('expires_in') || 3600),
      };
    }

    function clearHash() {
      if (window.location.hash) {
        history.replaceState(null, document.title, window.location.pathname + window.location.search);
      }
    }

    async function fetchDiscordProfile(session) {
      const response = await fetch('https://discord.com/api/users/@me', {
        headers: {
          Authorization: `${session.tokenType} ${session.accessToken}`,
        },
      });
      if (!response.ok) throw new Error('Discord profile request failed');
      return response.json();
    }

    async function applyUser(profile) {
      currentUser = profile;
      isOwner = profile?.email?.toLowerCase() === 'sanekdbvk@gmail.com';
      likes = await loadLikes();
      updateOwnerUI();
      render(tournaments);
    }

    async function bootstrapAuth() {
      const tokenFromHash = parseTokenFromHash();
      if (tokenFromHash) {
        clearHash();
        const session = {
          accessToken: tokenFromHash.accessToken,
          tokenType: tokenFromHash.tokenType,
          expiresAt: Date.now() + tokenFromHash.expiresIn * 1000,
        };
        try {
          const profile = normalizeProfile(await fetchDiscordProfile(session));
          persistSession(session, profile);
          await applyUser(profile);
          return;
        } catch (err) {
          console.error(err);
          alert(t('loginError'));
          await clearAuth();
          return;
        }
      }

      const storedSession = readStoredSession();
      if (storedSession?.expiresAt && storedSession.expiresAt > Date.now()) {
        const cachedProfile = readStoredProfile();
        if (cachedProfile) {
          await applyUser(cachedProfile);
          return;
        }
        try {
          const profile = normalizeProfile(await fetchDiscordProfile(storedSession));
          persistSession(storedSession, profile);
          await applyUser(profile);
          return;
        } catch (err) {
          console.error(err);
          await clearAuth();
        }
      } else {
        await clearAuth();
      }
    }

    async function bootstrapData() {
      tournaments = await loadTournaments();
      likes = await loadLikes();
      render(tournaments);
    }

    function startDiscordLogin() {
      if (!DISCORD_CLIENT_ID || DISCORD_CLIENT_ID.startsWith('YOUR_')) {
        alert(t('missingDiscordClient'));
        return;
      }

      const params = new URLSearchParams({
        response_type: 'token',
        client_id: DISCORD_CLIENT_ID,
        scope: DISCORD_SCOPE,
        redirect_uri: DISCORD_REDIRECT_URI,
        prompt: 'consent',
      });

      window.location.href = `https://discord.com/api/oauth2/authorize?${params.toString()}`;
    }

    languageSelect.value = translations[currentLang] ? currentLang : DEFAULT_LANG;
    applyTranslations();
    bootstrapData();
    bootstrapAuth();

    ownerToggle.addEventListener('click', async () => {
      if (currentUser) {
        await clearAuth();
      } else {
        startDiscordLogin();
      }
    });

    languageSelect.addEventListener('change', (event) => {
      const value = event.target.value;
      currentLang = translations[value] ? value : DEFAULT_LANG;
      localStorage.setItem('rematch:lang', currentLang);
      applyTranslations();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!isOwner) return;
      const formData = new FormData(form);
      const name = (formData.get('name') || '').toString().trim();
      const platform = (formData.get('platform') || '').toString().trim();
      const date = (formData.get('date') || '').toString();
      const link = (formData.get('link') || '').toString().trim();
      const notes = (formData.get('notes') || '').toString().trim();

      if (!name) return;

      const entry = {
        id: crypto.randomUUID(),
        name,
        platform,
        date,
        link,
        notes,
      };

      tournaments = [entry, ...tournaments];
      await saveTournaments(tournaments);
      render(tournaments);
      form.reset();
    });
  </script>
</body>
</html>
